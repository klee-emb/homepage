<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testimonials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Lato', sans-serif; }
  </style>
</head>
<body>
  <div class="relative isolate bg-white pt-24 pb-32 sm:pt-32">

    </div>
    <div aria-hidden="true" class="absolute inset-x-0 top-0 -z-10 flex transform-gpu overflow-hidden pt-32 opacity-25 blur-3xl sm:pt-40 xl:justify-end">
      <div style="clip-path: polygon(74.1% 44.1%, 100% 61.6%, 97.5% 26.9%, 85.5% 0.1%, 80.7% 2%, 72.5% 32.5%, 60.2% 62.4%, 52.4% 68.1%, 47.5% 58.3%, 45.2% 34.5%, 27.5% 76.7%, 0.1% 64.9%, 17.9% 100%, 27.6% 76.8%, 76.1% 97.7%, 74.1% 44.1%)" class="-ml-88 aspect-1313/771 w-328.25 flex-none origin-top-right rotate-30 bg-linear-to-tr from-[#ff80b5] to-[#9089fc] xl:mr-[calc(50%-12rem)] xl:ml-0"></div>
    </div>

    <div class="mx-auto max-w-7xl px-6 lg:px-8">
      <div class="mx-auto max-w-2xl text-center">
        <h2 class="text-base/7 font-semibold uppercase text-[#7f8aa4]">Testimonials</h2>
        <p class="mt-2 text-4xl font-semibold tracking-tight text-balance text-gray-900 sm:text-5xl">We have worked with thousands of amazing people</p>
      </div>

      <div class="mx-auto mt-16 grid max-w-2xl grid-cols-1 gap-8 text-sm/6 text-gray-900 sm:mt-20 sm:max-w-none md:grid-cols-[1fr_1.3fr_1fr] md:items-start">

        <!-- Left column -->
        <div class="flex flex-col gap-8">
          <figure class="rounded-2xl bg-white p-6 shadow-lg ring-1 ring-gray-900/5">
            <blockquote class="text-gray-900">
              <p>&#8220;It's honestly the best EMR I've worked with and I'm always trying to recommend it to other clinicians I meet. It's crazy the amount of features this EMR has for the price I pay for it.&#8221;</p>
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-x-4">
              <div class="flex size-10 flex-none items-center justify-center rounded-full bg-[#7f8aa4]/25 text-sm font-semibold text-[#7f8aa4]">RS</div>
              <div>
                <div class="font-semibold text-gray-900">Riley Shea</div>
                <div class="text-xs font-normal text-gray-600">Owner, Pride In Movement PT</div>
              </div>
            </figcaption>
          </figure>

          <figure class="rounded-2xl bg-white p-6 shadow-lg ring-1 ring-gray-900/5">
            <blockquote class="text-gray-900">
              <p>&#8220;Embodia has been so easy to navigate and customise. I'm also super impressed with the team's responsiveness. Honestly above and beyond. I have no regrets choosing Embodia for my practice management.&#8221;</p>
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-x-4">
              <div class="flex size-10 flex-none items-center justify-center rounded-full bg-gray-100 text-gray-400">
                <svg viewBox="0 0 20 20" fill="currentColor" class="size-6"><path fill-rule="evenodd" d="M10 8a3 3 0 100-6 3 3 0 000 6zm-7 8a7 7 0 1114 0H3z" clip-rule="evenodd" /></svg>
              </div>
              <div>
                <div class="font-semibold text-gray-900">Occupational Therapist, Practice Owner</div>
              </div>
            </figcaption>
          </figure>

          <figure class="rounded-2xl bg-white p-6 shadow-lg ring-1 ring-gray-900/5">
            <blockquote class="text-gray-900">
              <p>&#8220;Not only is Embodia's price point super competitive, but their platform is intuitive and there are so many extras. For us, Embodia's telerehab platform has been a big bang for our buck.&#8221;</p>
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-x-4">
              <div class="flex size-10 flex-none items-center justify-center rounded-full bg-[#7f8aa4]/25 text-sm font-semibold text-[#7f8aa4]">KO</div>
              <div>
                <div class="font-semibold text-gray-900">Kregg Ochitwa</div>
                <div class="text-xs font-normal text-gray-600">Owner, North 49 Physical Therapy</div>
              </div>
            </figcaption>
          </figure>

          <figure class="rounded-2xl bg-white p-6 shadow-lg ring-1 ring-gray-900/5">
            <blockquote class="text-gray-900">
              <p>&#8220;Embodia is very practical, easy to use, quick response time and excellent exercises to share with and monitor with clients.&#8221;</p>
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-x-4">
              <div class="flex size-10 flex-none items-center justify-center rounded-full bg-[#7f8aa4]/25 text-sm font-semibold text-[#7f8aa4]">YO</div>
              <div>
                <div class="font-semibold text-gray-900">Yvonne Osondu, RMT</div>
                <div class="text-xs font-normal text-gray-600">Owner, Reflexology &amp; Shiatsu Service</div>
              </div>
            </figcaption>
          </figure>
        </div>

        <!-- Center column -->
        <div class="flex flex-col gap-8">
          <figure class="rounded-2xl bg-white shadow-lg ring-1 ring-gray-900/5">
            <blockquote class="p-6 text-lg font-semibold tracking-tight text-gray-900 sm:p-12 sm:text-xl/8">
              <p>&#8220;This is my third EMR and this is by far the BEST! We have a thriving pelvic floor clinic with 3 therapists and 2 admin. I cannot recommend this platform enough! The customer service is also top notch.&#8221;</p>
            </blockquote>
            <figcaption class="flex flex-wrap items-center gap-x-4 gap-y-4 border-t border-gray-900/10 px-6 py-4 sm:flex-nowrap">
              <div class="flex size-10 flex-none items-center justify-center rounded-full bg-[#7f8aa4]/25 text-sm font-semibold text-[#7f8aa4]">JW</div>
              <div class="flex-auto">
                <div class="font-semibold text-gray-900">Julie Wallace, PT, DPT, CLT</div>
                <div class="text-xs font-normal text-gray-600">Owner, Insight Pelvic Health</div>
              </div>
            </figcaption>
          </figure>

          <figure class="rounded-2xl bg-white p-6 shadow-lg ring-1 ring-gray-900/5">
            <blockquote class="text-gray-900">
              <p>&#8220;I have tried some other popular EMR's for physical therapists and quickly found that Embodia is the best. The ease and flow make this practice management system a hands-down winner. In case that weren't enough, their prompt and friendly customer service makes Embodia second to none.&#8221;</p>
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-x-4">
              <div class="flex size-10 flex-none items-center justify-center rounded-full bg-[#7f8aa4]/25 text-sm font-semibold text-[#7f8aa4]">AI</div>
              <div>
                <div class="font-semibold text-gray-900">Anthony Inzillo, PT</div>
                <div class="text-xs font-normal text-gray-600">Owner, SWELL Physical Therapy &amp; Performance</div>
              </div>
            </figcaption>
          </figure>

          <figure class="rounded-2xl bg-white p-6 shadow-lg ring-1 ring-gray-900/5">
            <blockquote class="text-gray-900">
              <p>&#8220;When I started out as a solopreneur over two years ago it was a very affordable option to get my business organised. As I've grown my practice and my team, Embodia continues to work really well for me.&#8221;</p>
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-x-4">
              <div class="flex size-10 flex-none items-center justify-center rounded-full bg-[#7f8aa4]/25 text-sm font-semibold text-[#7f8aa4]">LC</div>
              <div>
                <div class="font-semibold text-gray-900">Laura Currens, PT, DPT, PCES</div>
                <div class="text-xs font-normal text-gray-600">Owner, Dynamic Flow Physical Therapy</div>
              </div>
            </figcaption>
          </figure>

          <figure class="rounded-2xl bg-white p-6 shadow-lg ring-1 ring-gray-900/5">
            <blockquote class="text-gray-900">
              <p>&#8220;Embodia makes it easy to manage my entire physiotherapy practice. It is easy to completely customize the entire platform to my practice set-up. The low monthly fee for the Tier 3 membership provides amazing value!&#8221;</p>
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-x-4">
              <div class="flex size-10 flex-none items-center justify-center rounded-full bg-[#7f8aa4]/25 text-sm font-semibold text-[#7f8aa4]">MC</div>
              <div>
                <div class="font-semibold text-gray-900">Mark Crone, PT</div>
                <div class="text-xs font-normal text-gray-600">Owner, Oak Lane Physiotherapy</div>
              </div>
            </figcaption>
          </figure>
        </div>

        <!-- Right column -->
        <div class="flex flex-col gap-8">
          <figure class="rounded-2xl bg-white p-6 shadow-lg ring-1 ring-gray-900/5">
            <blockquote class="text-gray-900">
              <p>&#8220;Embodia makes things easy. It's super organised, intuitive, and it just works. It's been an essential part of letting me run my physio practice fully online.&#8221;</p>
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-x-4">
              <img src="/assets/testimonials/heather-taylor.jpg" alt="Heather Taylor" class="size-10 flex-none rounded-full bg-gray-100 object-cover" />
              <div>
                <div class="font-semibold text-gray-900">Heather Taylor</div>
                <div class="text-xs font-normal text-gray-600">Physiotherapist</div>
              </div>
            </figcaption>
          </figure>

          <figure class="rounded-2xl bg-white p-6 shadow-lg ring-1 ring-gray-900/5">
            <blockquote class="text-gray-900">
              <p>&#8220;My patients LOVE having an exercise video to follow and reminders on their phone to do their exercises. No more paper handouts! They're more compliant and I save so much time.&#8221;</p>
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-x-4">
              <img src="/assets/testimonials/carolyn-vandyken.jpg" alt="Carolyn Vandyken" class="size-10 flex-none rounded-full bg-gray-100 object-cover" />
              <div>
                <div class="font-semibold text-gray-900">Carolyn Vandyken</div>
                <div class="text-xs font-normal text-gray-600">Physiotherapist &amp; CE Instructor</div>
              </div>
            </figcaption>
          </figure>

          <figure class="rounded-2xl bg-white p-6 shadow-lg ring-1 ring-gray-900/5">
            <blockquote class="text-gray-900">
              <p>&#8220;The best part is their customer service &mdash; they not only respond in a timely fashion but are also willing to provide video call support.&#8221;</p>
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-x-4">
              <div class="flex size-10 flex-none items-center justify-center rounded-full bg-[#7f8aa4]/25 text-sm font-semibold text-[#7f8aa4]">AK</div>
              <div>
                <div class="font-semibold text-gray-900">Dr. Aparna Kamulkar</div>
                <div class="text-xs font-normal text-gray-600">Pelvic Rehab Specialist</div>
              </div>
            </figcaption>
          </figure>

          <figure class="rounded-2xl bg-white p-6 shadow-lg ring-1 ring-gray-900/5">
            <blockquote class="text-gray-900">
              <p>&#8220;Such a great fit for my practice! Very intuitive and streamlines so much of my day to day tasks.&#8221;</p>
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-x-4">
              <div class="flex size-10 flex-none items-center justify-center rounded-full bg-[#7f8aa4]/25 text-sm font-semibold text-[#7f8aa4]">RP</div>
              <div>
                <div class="font-semibold text-gray-900">Rachel Phillips, DPT</div>
                <div class="text-xs font-normal text-gray-600">Owner, Kinetic Physical Therapy</div>
              </div>
            </figcaption>
          </figure>
        </div>

      </div>

      <p class="mx-auto mt-10 max-w-2xl text-center text-xs text-gray-500">Testimonials are shared with each contributor's approval. Some identifying details withheld on request.</p>
    </div>
  </div>
